name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every supported Node, because the kit is built and its generated files checked by Node
  # scripts as well as consumed by Node servers that render it.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Generated files in sync, type-check, lint, tests.
      - run: npm run check
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:package

  # The calendar and date-range helpers are the part that could quietly depend on the
  # runner being in UTC. Eucla is +08:45, which also catches a half-hour assumption.
  timezone:
    runs-on: ubuntu-latest
    env:
      TZ: Australia/Eucla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  # Every gallery, sample and error page at 320–1024 px. Mobile is part of done for this kit.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run audit:mobile
