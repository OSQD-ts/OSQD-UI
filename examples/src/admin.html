<!doctype html>
<html lang="en" class="oq" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rules Admin</title>
<link rel="stylesheet" href="../styles/index.css">
<link rel="stylesheet" href="lib/samples.css">
<script src="../assets/osqd-ui-elements.js" defer></script>
<script src="lib/forms-logic.js" defer></script>
<script src="lib/demo-kit.js" defer></script>
<style>
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters .oq-input-group { flex: 1 1 260px; max-width: 360px; }
  .filters .oq-select { width: auto; }
  .bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--oq-border); background: var(--oq-selection); }
  .rule-link { font-weight: 500; color: var(--oq-text); text-decoration: none; white-space: nowrap; }
  .rule-link:hover { text-decoration: underline; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 20px; }
  .form-grid .wide { grid-column: 1 / -1; }
  .bulk { flex-wrap: wrap; }
  @media (max-width: 760px) {
    .filters .oq-input-group { flex: 1 1 100%; max-width: none; }
    .filters .oq-select { flex: 1 1 0; min-width: 0; }
    .filters #f-sort { flex-basis: 100%; }
  }
  @media (max-width: 640px) {
    .bulk > strong { flex: 1 1 100%; }
    .bulk > .oq-spacer { display: none; }
    .rules .rule-link { display: block; padding-block: 8px; margin-block: -8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .oq-page-header__actions > .oq-btn { flex: 1 1 auto; }
  }
</style>
</head>
<body class="oq">
<div class="oq-shell" id="shell">
  <header class="oq-appbar oq-appbar--sticky">
    <button class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral oq-shell__rail-btn" id="rail-btn" aria-pressed="false" aria-label="Collapse sidebar" data-tip="Collapse sidebar" data-tip-pos="bottom">{{icon:sidebar}}</button>
    <button class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral oq-shell__menu-btn" id="menu-btn" aria-expanded="false" aria-label="Open menu">{{icon:menu}}</button>
    {{brand:Rules Admin}}
    <div class="oq-spacer"></div>
    {{appbar-end}}
    <span class="oq-avatar oq-sm sx-hide-sm">MP</span>
  </header>
  <aside class="oq-sidebar">
    <nav class="oq-nav" aria-label="Main">
      <div class="oq-nav__section oq-overline">Detection</div>
      <a class="oq-nav__item" href="#/rules" aria-current="page" data-tip="Rules" data-tip-pos="right">{{icon:shield}}<span class="oq-nav__label">Rules</span><span class="oq-badge oq-neutral" id="nav-count"></span></a>
      <a class="oq-nav__item" href="logs.html" data-tip="Events" data-tip-pos="right">{{icon:list}}<span class="oq-nav__label">Events</span></a>
      <a class="oq-nav__item" href="dashboard.html" data-tip="Dashboard" data-tip-pos="right">{{icon:activity}}<span class="oq-nav__label">Dashboard</span></a>
      <div class="oq-nav__section oq-overline">Project</div>
      <a class="oq-nav__item" href="settings.html" data-tip="Settings" data-tip-pos="right">{{icon:settings}}<span class="oq-nav__label">Settings</span></a>
      <a class="oq-nav__item" href="login.html" data-tip="Sign out" data-tip-pos="right">{{icon:log-out}}<span class="oq-nav__label">Sign out</span></a>
    </nav>
  </aside>
  <div class="oq-shell__backdrop" id="backdrop" aria-hidden="true"></div>
  <main class="oq-shell__main" id="view" tabindex="-1"></main>
</div>

<oq-dialog id="confirm">
  <dialog class="oq-dialog oq-confirm" style="--w: 440px">
    <div class="oq-dialog__header"><h3 class="oq-dialog__title" id="confirm-title"></h3></div>
    <div class="oq-dialog__body oq-stack">
      <p class="oq-confirm__message oq-muted" id="confirm-message"></p>
      <div id="confirm-type-wrap"><label class="oq-label" for="confirm-type">Type <code id="confirm-word"></code> to confirm</label><input class="oq-input oq-input--mono oq-confirm__type" id="confirm-type" autocomplete="off"></div>
    </div>
    <div class="oq-dialog__footer"><button class="oq-btn oq-btn--ghost oq-neutral" data-close="cancel">Cancel</button><button class="oq-btn oq-danger" id="confirm-ok" data-close="ok">Delete</button></div>
  </dialog>
</oq-dialog>

<script>
addEventListener("DOMContentLoaded", () => {
  const { $, $$, esc, rng, railShell, toast, barChart } = OQX;
  const V = OQForms.validators;
  railShell($("#shell"), { railBtn: $("#rail-btn"), menuBtn: $("#menu-btn"), backdrop: $("#backdrop"), storageKey: "oq-samples-admin-rail" });
  const view = $("#view");
  const ico = { edit: `{{icon:edit:oq-sm}}`, trash: `{{icon:trash:oq-sm}}`, plus: `{{icon:plus:oq-sm}}`, search: `{{icon:search:oq-sm}}`, more: `{{icon:more-horizontal}}`, left: `{{icon:chevron-left}}`, right: `{{icon:chevron-right}}`, power: `{{icon:power:oq-sm}}`, copy: `{{icon:copy:oq-sm}}` };

  // ---------- Data ----------
  const r = rng(9);
  const DETECTORS = ["rate", "tor-exit", "user-agent", "headers", "geo", "reputation"];
  const ACTIONS = { block: "danger", challenge: "warning", log: "neutral" };
  const PEOPLE = ["MP", "AK", "JN"];
  const names = ["login-burst", "api-scrapers", "tor-block", "empty-agent", "header-order", "geo-fence-ru", "reputation-low", "admin-allowlist", "checkout-rate", "search-spam", "signup-flood", "token-stuffing"];
  let seq = 100;
  const rules = Array.from({ length: 57 }, (_, i) => {
    const base = names[i % names.length];
    const detector = DETECTORS[Math.floor(r() * DETECTORS.length)];
    return {
      id: `r${++seq}`,
      name: i < names.length ? base : `${base}-${Math.floor(i / names.length) + 1}`,
      detector, action: Object.keys(ACTIONS)[Math.floor(r() * 3)],
      threshold: 20 + Math.floor(r() * 16) * 5, window: [60, 300, 900][Math.floor(r() * 3)],
      paths: r() < 0.5 ? ["/api/login"] : ["/api/*", "/search"],
      enabled: r() < 0.82, hits: Math.floor(r() * r() * 9000), owner: PEOPLE[Math.floor(r() * 3)],
      updated: Date.now() - Math.floor(r() * 40) * 86400000 - Math.floor(r() * 86400000),
      description: `Flags clients that trip the ${detector} detector on the listed paths.`,
      activity: [["Created", PEOPLE[Math.floor(r() * 3)], 30], ["Threshold changed 40 → 60", "AK", 9], ["Enabled", "MP", 2]],
    };
  });
  const ago = (t) => { const d = Math.round((Date.now() - t) / 86400000); return d === 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };
  const fmt = new Intl.NumberFormat("en-US").format;
  const byId = (id) => rules.find((x) => x.id === id);
  const syncCount = () => ($("#nav-count").textContent = rules.length);

  // ---------- Confirm (the useConfirm() pattern on <oq-dialog>) ----------
  const confirmDlg = $("#confirm");
  const confirm = ({ title, message, word, label = "Delete" }) => new Promise((resolve) => {
    $("#confirm-title").textContent = title;
    $("#confirm-message").textContent = message;
    $("#confirm-ok").textContent = label;
    $("#confirm-type-wrap").hidden = !word;
    $("#confirm-word").textContent = word ?? "";
    $("#confirm-type").value = "";
    $("#confirm-ok").disabled = Boolean(word);
    const done = (e) => { confirmDlg.removeEventListener("oq-close", done); resolve(e.detail.returnValue === "ok"); };
    confirmDlg.addEventListener("oq-close", done);
    confirmDlg.show();
    setTimeout(() => (word ? $("#confirm-type") : $("#confirm-ok")).focus(), 30);
  });
  $("#confirm-type").addEventListener("input", (e) => ($("#confirm-ok").disabled = e.target.value !== $("#confirm-word").textContent));

  // ---------- List ----------
  const list = { q: "", action: "", status: "", page: 0, per: 10, sort: "updated", dir: -1, selected: new Set() };
  function renderList() {
    const q = list.q.toLowerCase();
    let rows = rules.filter((x) => (!q || `${x.name} ${x.detector}`.includes(q)) && (!list.action || x.action === list.action) && (!list.status || String(x.enabled) === list.status));
    rows.sort((a, b) => (a[list.sort] > b[list.sort] ? 1 : a[list.sort] < b[list.sort] ? -1 : 0) * list.dir);
    const pages = Math.max(1, Math.ceil(rows.length / list.per));
    list.page = Math.min(list.page, pages - 1);
    const pageRows = rows.slice(list.page * list.per, (list.page + 1) * list.per);
    const sel = [...list.selected].filter((id) => byId(id));
    const allOnPage = pageRows.length > 0 && pageRows.every((x) => list.selected.has(x.id));
    const th = (key, labelText, cls = "") => `<th aria-sort="${list.sort === key ? (list.dir > 0 ? "ascending" : "descending") : "none"}" data-sort="${key}" class="${cls}">${labelText}</th>`;
    view.innerHTML = `
      <header class="oq-page-header">
        <ol class="oq-breadcrumbs"><li><a href="#/rules">Detection</a></li><li><span aria-current="page">Rules</span></li></ol>
        <div class="oq-page-header__row">
          <div class="oq-page-header__heading"><div class="oq-page-header__title-row"><h1 class="oq-page-header__title">Rules</h1><span class="oq-chip oq-neutral">${rules.length}</span></div>
            <div class="oq-page-header__subtitle">What each detector does when it fires. Changes reach the nodes within 30 seconds.</div></div>
          <div class="oq-page-header__actions"><a class="oq-btn" href="#/rules/new">${ico.plus} New rule</a></div>
        </div>
      </header>
      <div class="oq-stack oq-gap-3">
        <div class="filters">
          <div class="oq-input-group"><span class="oq-addon oq-addon--plain">${ico.search}</span><input class="oq-input" id="q" placeholder="Search by name or detector" aria-label="Search rules" value="${esc(list.q)}"></div>
          <select class="oq-select" id="f-action" aria-label="Action"><option value="">Any action</option>${Object.keys(ACTIONS).map((a) => `<option ${list.action === a ? "selected" : ""}>${a}</option>`).join("")}</select>
          <select class="oq-select" id="f-status" aria-label="Status"><option value="">Any status</option><option value="true" ${list.status === "true" ? "selected" : ""}>Enabled</option><option value="false" ${list.status === "false" ? "selected" : ""}>Disabled</option></select>
          <select class="oq-select sx-show-sm" id="f-sort" aria-label="Sort by">${[["updated:-1", "Recently updated"], ["name:1", "Name A–Z"], ["hits:-1", "Most hits"], ["threshold:-1", "Highest threshold"]].map(([v, l]) => `<option value="${v}" ${`${list.sort}:${list.dir}` === v ? "selected" : ""}>${l}</option>`).join("")}</select>
          ${list.q || list.action || list.status ? '<button class="oq-btn oq-btn--ghost oq-neutral oq-sm" id="clear">Clear filters</button>' : ""}
        </div>
        <div class="oq-table-wrap">
          ${sel.length ? `<div class="bulk" role="region" aria-label="Bulk actions"><strong>${sel.length} selected</strong><span class="oq-spacer"></span><button class="oq-btn oq-btn--outline oq-neutral oq-sm" data-bulk="enable">Enable</button><button class="oq-btn oq-btn--outline oq-neutral oq-sm" data-bulk="disable">Disable</button><button class="oq-btn oq-btn--outline oq-danger oq-sm" data-bulk="delete">${ico.trash} Delete</button><button class="oq-btn oq-btn--ghost oq-neutral oq-sm" data-bulk="none">Clear</button></div>` : ""}
          <table class="oq-table oq-table--hover sx-cards rules">
            <thead><tr><th class="oq-table__check" data-label="Select this page"><label class="sx-hit"><input type="checkbox" class="oq-checkbox" id="all" aria-label="Select all on this page" ${allOnPage ? "checked" : ""}></label></th>
              ${th("name", "Rule")}${th("detector", "Detector", "sx-hide-md")}<th>Action</th>${th("threshold", "Threshold", "oq-num sx-hide-md")}${th("hits", "Hits 24 h", "oq-num")}<th>Status</th>${th("updated", "Updated", "sx-hide-md")}</tr></thead>
            <tbody>${pageRows.map((x) => `<tr aria-selected="${list.selected.has(x.id)}">
              <td class="oq-table__check"><label class="sx-hit"><input type="checkbox" class="oq-checkbox" data-sel="${x.id}" aria-label="Select ${esc(x.name)}" ${list.selected.has(x.id) ? "checked" : ""}></label></td>
              <td><a class="rule-link oq-mono" href="#/rules/${x.id}">${esc(x.name)}</a></td>
              <td class="sx-hide-md"><span class="oq-chip oq-sm oq-chip--square oq-neutral">${x.detector}</span></td>
              <td><span class="oq-chip oq-sm oq-${ACTIONS[x.action]}">${x.action}</span></td>
              <td class="oq-num sx-hide-md">${x.threshold}</td>
              <td class="oq-num" data-label="Hits 24 h">${fmt(x.hits)}</td>
              <td><span class="oq-status"><span class="oq-dot oq-${x.enabled ? "success" : "neutral"}"></span>${x.enabled ? "Enabled" : "Disabled"}</span></td>
              <td class="oq-muted oq-small sx-hide-md">${ago(x.updated)}</td></tr>`).join("") ||
              `<tr><td colspan="8"><div class="oq-empty">{{illustration:no-results}}<div class="oq-empty__title">No rules match</div><div class="oq-small">Try another search or clear the filters.</div></div></td></tr>`}</tbody>
          </table>
          <div class="oq-table-pagination">
            <label>Rows per page <select class="oq-select oq-sm" id="per">${[10, 20, 50].map((n) => `<option ${n === list.per ? "selected" : ""}>${n}</option>`).join("")}</select></label>
            <span class="oq-table-pagination__range" aria-live="polite">${rows.length ? `${list.page * list.per + 1}–${Math.min(rows.length, (list.page + 1) * list.per)} of ${rows.length}` : "0 of 0"}</span>
            <span class="oq-table-pagination__nav">
              <button type="button" class="oq-btn oq-btn--ghost oq-btn--icon oq-neutral oq-sm" aria-label="Previous page" data-page="-1" ${list.page === 0 ? "disabled" : ""}>${ico.left}</button>
              <button type="button" class="oq-btn oq-btn--ghost oq-btn--icon oq-neutral oq-sm" aria-label="Next page" data-page="1" ${list.page >= pages - 1 ? "disabled" : ""}>${ico.right}</button>
            </span>
          </div>
        </div>
      </div>`;
    const keepFocus = (id) => { const el = $(`#${id}`); if (el) { el.focus(); const n = el.value.length; el.setSelectionRange?.(n, n); } };
    $("#q").oninput = (e) => { list.q = e.target.value; list.page = 0; renderList(); keepFocus("q"); };
    $("#f-action").onchange = (e) => { list.action = e.target.value; list.page = 0; renderList(); };
    $("#f-status").onchange = (e) => { list.status = e.target.value; list.page = 0; renderList(); };
    $("#clear")?.addEventListener("click", () => { Object.assign(list, { q: "", action: "", status: "", page: 0 }); renderList(); });
    $("#per").onchange = (e) => { list.per = +e.target.value; list.page = 0; renderList(); };
    $("#f-sort").onchange = (e) => { const [k, d] = e.target.value.split(":"); list.sort = k; list.dir = +d; renderList(); };
    $$("[data-page]").forEach((b) => (b.onclick = () => { list.page += +b.dataset.page; renderList(); }));
    $$("th[data-sort]").forEach((h) => (h.onclick = () => { const k = h.dataset.sort; list.dir = list.sort === k ? -list.dir : 1; list.sort = k; renderList(); }));
    $("#all").onchange = (e) => { pageRows.forEach((x) => (e.target.checked ? list.selected.add(x.id) : list.selected.delete(x.id))); renderList(); };
    $$("[data-sel]").forEach((c) => (c.onchange = () => { c.checked ? list.selected.add(c.dataset.sel) : list.selected.delete(c.dataset.sel); renderList(); }));
    $$("[data-bulk]").forEach((b) => (b.onclick = async () => {
      const ids = [...list.selected];
      if (b.dataset.bulk === "none") list.selected.clear();
      if (b.dataset.bulk === "enable" || b.dataset.bulk === "disable") { ids.forEach((id) => (byId(id).enabled = b.dataset.bulk === "enable")); toast(`${ids.length} rules ${b.dataset.bulk}d`); }
      if (b.dataset.bulk === "delete") {
        if (!(await confirm({ title: `Delete ${ids.length} rules?`, message: "Nodes stop applying them within 30 seconds. This cannot be undone.", word: `delete ${ids.length}` }))) return;
        ids.forEach((id) => rules.splice(rules.indexOf(byId(id)), 1));
        list.selected.clear(); syncCount();
        toast(`${ids.length} rules deleted`, "danger");
      }
      renderList();
    }));
  }

  // ---------- Detail ----------
  function renderDetail(x) {
    const hours = Array.from({ length: 24 }, (_, h) => ({ h: `${String(h).padStart(2, "0")}h`, hits: Math.round((x.hits / 24) * (0.5 + r())) }));
    view.innerHTML = `
      <div class="oq-detail" style="--aside-w: 300px">
        <header class="oq-page-header">
          <ol class="oq-breadcrumbs"><li><a href="#/rules">Rules</a></li><li><span aria-current="page">${esc(x.name)}</span></li></ol>
          <div class="oq-page-header__row">
            <div class="oq-page-header__heading">
              <div class="oq-page-header__title-row"><h1 class="oq-page-header__title oq-mono">${esc(x.name)}</h1><span class="oq-chip oq-${x.enabled ? "success" : "neutral"}">${x.enabled ? "Enabled" : "Disabled"}</span></div>
              <div class="oq-page-header__subtitle">${esc(x.description)}</div>
              <ul class="oq-page-header__meta"><li>{{icon:user:oq-sm}} ${x.owner}</li><li>{{icon:clock:oq-sm}} Updated ${ago(x.updated)}</li><li>{{icon:zap:oq-sm}} ${fmt(x.hits)} hits in 24 h</li></ul>
            </div>
            <div class="oq-page-header__actions">
              <button class="oq-btn oq-btn--outline oq-neutral" id="toggle">${ico.power} ${x.enabled ? "Disable" : "Enable"}</button>
              <a class="oq-btn" href="#/rules/${x.id}/edit">${ico.edit} Edit</a>
              <oq-dropdown><details class="oq-dropdown oq-dropdown--end"><summary class="oq-btn oq-btn--ghost oq-neutral oq-btn--icon" aria-label="More actions">${ico.more}</summary>
                <div class="oq-menu" role="menu"><button class="oq-menu__item" role="menuitem" data-value="duplicate">${ico.copy} Duplicate</button><div class="oq-menu__sep" role="separator"></div><button class="oq-menu__item oq-danger" role="menuitem" data-value="delete">${ico.trash} Delete…</button></div></details></oq-dropdown>
            </div>
          </div>
        </header>
        <div class="oq-detail__main">
          <oq-tabs>
            <div class="oq-tabs" role="tablist" aria-label="Rule">
              <button class="oq-tab" role="tab" id="t-1" aria-controls="p-1">Overview</button>
              <button class="oq-tab" role="tab" id="t-2" aria-controls="p-2">Activity</button>
              <button class="oq-tab" role="tab" id="t-3" aria-controls="p-3">Definition</button>
            </div>
            <div class="oq-tabpanel" role="tabpanel" id="p-1">
              <div class="oq-stack oq-gap-4">
                <section class="oq-detail__section"><h3>Hits per hour</h3><div id="hits"></div></section>
                <section class="oq-detail__section"><h3>Condition</h3><p class="oq-muted">Score from <code>${x.detector}</code> at or above <strong>${x.threshold}</strong> within ${x.window / 60} min on ${x.paths.map((p) => `<code>${esc(p)}</code>`).join(", ")} → <span class="oq-chip oq-sm oq-${ACTIONS[x.action]}">${x.action}</span></p></section>
              </div>
            </div>
            <div class="oq-tabpanel" role="tabpanel" id="p-2">
              <ol class="oq-timeline">${[...x.activity].reverse().map(([what, who, d], i) => `<li class="oq-timeline__item ${i === 0 ? "oq-timeline__item--filled oq-primary" : "oq-neutral"}"><span class="oq-timeline__dot"></span><div class="oq-timeline__content"><div class="oq-timeline__head"><span class="oq-timeline__title">${esc(what)}</span><span class="oq-timeline__time">${d === 0 ? "now" : `${d} d ago`}</span></div><div class="oq-timeline__body">by ${who}</div></div></li>`).join("")}</ol>
            </div>
            <div class="oq-tabpanel" role="tabpanel" id="p-3">
              <pre class="oq-pre">${esc(JSON.stringify({ name: x.name, detector: x.detector, threshold: x.threshold, windowSeconds: x.window, paths: x.paths, action: x.action, enabled: x.enabled }, null, 2))}</pre>
            </div>
          </oq-tabs>
        </div>
        <aside class="oq-detail__aside">
          <div class="oq-card"><div class="oq-card__body">
            <dl class="oq-dl">
              <dt>ID</dt><dd class="oq-mono">${x.id}</dd>
              <dt>Detector</dt><dd><span class="oq-chip oq-sm oq-chip--square oq-neutral">${x.detector}</span></dd>
              <dt>Action</dt><dd><span class="oq-chip oq-sm oq-${ACTIONS[x.action]}">${x.action}</span></dd>
              <dt>Threshold</dt><dd>${x.threshold}<div class="oq-progress oq-sm" style="margin-top: 6px"><div class="oq-progress__bar" style="--value: ${x.threshold}%"></div></div></dd>
              <dt>Window</dt><dd>${x.window / 60} min</dd>
              <dt>Owner</dt><dd><span class="oq-row oq-gap-2"><span class="oq-avatar oq-sm">${x.owner}</span>${x.owner}</span></dd>
            </dl>
          </div></div>
        </aside>
      </div>`;
    barChart($("#hits"), { label: "Hits per hour", x: "h", data: hours, height: 170, series: [{ key: "hits", label: "Hits" }] });
    $("#toggle").onclick = () => { x.enabled = !x.enabled; x.activity.push([x.enabled ? "Enabled" : "Disabled", "MP", 0]); x.updated = Date.now(); renderDetail(x); toast(`${x.name} ${x.enabled ? "enabled" : "disabled"}`); };
    $("oq-dropdown", view).addEventListener("oq-select", async (e) => {
      if (e.detail.value === "duplicate") { const c = { ...structuredClone(x), id: `r${++seq}`, name: `${x.name}-copy`, enabled: false, hits: 0, updated: Date.now(), activity: [["Duplicated from " + x.name, "MP", 0]] }; rules.unshift(c); syncCount(); location.hash = `#/rules/${c.id}/edit`; toast("Rule duplicated"); }
      if (e.detail.value === "delete") del(x);
    });
  }
  async function del(x) {
    if (!(await confirm({ title: `Delete ${x.name}?`, message: "Nodes stop applying it within 30 seconds. Its history is kept for 14 days.", word: x.name }))) return;
    rules.splice(rules.indexOf(x), 1); syncCount();
    toast(`${x.name} deleted`, "danger");
    location.hash = "#/rules";
  }

  // ---------- Edit / new ----------
  function renderEdit(x) {
    const isNew = !x;
    const draft = x ? structuredClone(x) : { name: "", detector: "rate", action: "challenge", threshold: 60, window: 300, paths: ["/api/*"], enabled: true, description: "" };
    view.innerHTML = `
      <header class="oq-page-header">
        <ol class="oq-breadcrumbs"><li><a href="#/rules">Rules</a></li>${isNew ? "" : `<li><a href="#/rules/${x.id}">${esc(x.name)}</a></li>`}<li><span aria-current="page">${isNew ? "New rule" : "Edit"}</span></li></ol>
        <div class="oq-page-header__row"><div class="oq-page-header__heading"><h1 class="oq-page-header__title">${isNew ? "New rule" : `Edit <span class="oq-mono">${esc(x.name)}</span>`}</h1></div></div>
      </header>
      <form class="oq-form oq-stack oq-gap-5" id="edit" novalidate style="max-width: 860px">
        <div id="summary"></div>
        <section class="oq-card"><div class="oq-card__body form-grid">
          <div class="oq-field" data-f="name"><label class="oq-label" for="e-name">Name <span class="oq-req">*</span></label><input class="oq-input oq-input--mono" id="e-name" name="name" value="${esc(draft.name)}" placeholder="login-burst"><span class="oq-help" data-help>Lowercase letters, digits and dashes.</span></div>
          <div class="oq-field"><label class="oq-label" for="e-detector">Detector</label><select class="oq-select" id="e-detector" name="detector">${DETECTORS.map((d) => `<option ${d === draft.detector ? "selected" : ""}>${d}</option>`).join("")}</select></div>
          <div class="oq-field" data-f="threshold"><label class="oq-label" for="e-threshold">Threshold</label><div class="oq-input-group"><input class="oq-input" id="e-threshold" name="threshold" value="${draft.threshold}" inputmode="numeric"><span class="oq-addon">/ 100</span></div><span class="oq-help" data-help>Detectors cap at 100.</span></div>
          <div class="oq-field"><label class="oq-label" for="e-window">Window</label><select class="oq-select" id="e-window" name="window">${[[60, "1 minute"], [300, "5 minutes"], [900, "15 minutes"]].map(([v, l]) => `<option value="${v}" ${v === draft.window ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="oq-field wide"><span class="oq-label">Action</span><div class="oq-row oq-gap-4 oq-wrap" role="radiogroup" aria-label="Action">${Object.keys(ACTIONS).map((a) => `<label class="oq-check"><input type="radio" class="oq-radio" name="action" value="${a}" ${a === draft.action ? "checked" : ""}> ${a}</label>`).join("")}</div></div>
          <div class="oq-field wide" data-f="paths"><span class="oq-label" id="paths-label">Paths</span>
            <oq-tag-input class="oq-tags" id="e-paths" value="${esc(draft.paths.join(","))}" pattern="/[\\w/*.-]*"><input aria-labelledby="paths-label" placeholder="/api/*, Enter to add"></oq-tag-input>
            <span class="oq-help" data-help>Start with “/”; “*” matches any segment.</span></div>
          <div class="oq-field wide"><label class="oq-label" for="e-desc">Description</label><textarea class="oq-textarea" id="e-desc" name="description" rows="3">${esc(draft.description)}</textarea></div>
          <label class="oq-check wide"><input type="checkbox" role="switch" class="oq-switch" name="enabled" ${draft.enabled ? "checked" : ""}> Enabled</label>
        </div>
        <div class="oq-card__footer">${isNew ? "" : `<button type="button" class="oq-btn oq-btn--ghost oq-danger" id="delete" style="margin-right: auto">${ico.trash} Delete</button>`}<a class="oq-btn oq-btn--ghost oq-neutral" href="${isNew ? "#/rules" : `#/rules/${x.id}`}">Cancel</a><button class="oq-btn" type="submit" id="save">${isNew ? "Create rule" : "Save changes"}</button></div></section>
        <div class="oq-savebar oq-savebar--sticky" id="savebar" hidden role="region" aria-label="Unsaved changes">
          <span class="oq-dot oq-warning" aria-hidden="true"></span><span class="oq-savebar__message">Unsaved changes<span class="oq-savebar__errors"></span></span><span class="oq-spacer"></span>
          <button type="button" class="oq-btn oq-btn--ghost oq-neutral" id="discard">Discard</button><button type="submit" class="oq-btn">Save</button>
        </div>
      </form>`;
    const form = $("#edit");
    let paths = [...draft.paths], submitted = false, errors = {};
    $("#e-paths").addEventListener("oq-change", (e) => { paths = e.detail.tags; sync(); });
    $("#e-paths").addEventListener("oq-reject", (e) => toast(`“${e.detail.value}” is not a path`, "warning"));
    const state = () => JSON.stringify([[...new FormData(form)], paths]);
    const base = state();
    const rules_ = {
      name: [V.required("A name is required."), V.pattern(/^[a-z0-9-]+$/, "Use lowercase letters, digits and dashes."), V.custom((v) => !rules.some((o) => o.name === v && o.id !== x?.id), "Another rule already has this name.")],
      threshold: [V.required(), V.integer(), V.min(1), V.max(100, "Must be 100 or less: a higher threshold can never fire.")],
    };
    const labels = { name: "Name", threshold: "Threshold", paths: "Paths" };
    const validate = () => {
      errors = {};
      for (const [k, list] of Object.entries(rules_)) {
        const msg = OQForms.runValidators(list, form.elements[k].value);
        if (msg) errors[k] = msg;
        const box = $(`[data-f="${k}"]`, form), help = $("[data-help]", box);
        help.dataset.default ??= help.textContent;
        box.classList.toggle("is-invalid", Boolean(msg)); form.elements[k].setAttribute("aria-invalid", String(Boolean(msg)));
        help.textContent = msg || help.dataset.default;
      }
      if (!paths.length) errors.paths = "Add at least one path.";
      $('[data-f="paths"]', form).classList.toggle("is-invalid", Boolean(errors.paths));
      const n = Object.keys(errors).length;
      $("#summary").innerHTML = submitted && n ? `<div class="oq-error-summary" role="alert" tabindex="-1"><div class="oq-error-summary__title">${n} ${n === 1 ? "field needs" : "fields need"} attention</div><ul class="oq-error-summary__list">${Object.entries(errors).map(([k, m]) => `<li><a href="#" data-focus="${k}"><strong>${labels[k]}</strong> — ${esc(m)}</a></li>`).join("")}</ul></div>` : "";
      return n === 0;
    };
    const sync = () => {
      if (submitted) validate();
      $("#savebar").hidden = state() === base;
      const n = submitted ? Object.keys(errors).length : 0;
      $(".oq-savebar__errors", form).textContent = n ? ` · ${n} to fix` : "";
    };
    form.addEventListener("input", sync);
    form.addEventListener("change", sync);
    $("#summary").addEventListener("click", (e) => { const a = e.target.closest("[data-focus]"); if (!a) return; e.preventDefault(); (a.dataset.focus === "paths" ? $("#e-paths input") : form.elements[a.dataset.focus]).focus(); });
    $("#discard").onclick = () => renderEdit(x);
    $("#delete")?.addEventListener("click", () => del(x));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      submitted = true;
      if (!validate()) { sync(); $(".oq-error-summary")?.focus(); return; }
      const f = new FormData(form);
      const next = { name: f.get("name"), detector: f.get("detector"), threshold: +f.get("threshold"), window: +f.get("window"), action: f.get("action"), paths, description: String(f.get("description")), enabled: f.get("enabled") === "on" };
      $("#save").setAttribute("aria-busy", "true");
      setTimeout(() => {
        leaveGuard = null; // saved: leaving is no longer losing anything
        if (isNew) { const created = { id: `r${++seq}`, hits: 0, owner: "MP", updated: Date.now(), activity: [["Created", "MP", 0]], ...next, description: next.description || "No description." }; rules.unshift(created); syncCount(); location.hash = `#/rules/${created.id}`; toast(`${created.name} created`); }
        else { Object.assign(x, next, { updated: Date.now() }); x.activity.push(["Edited", "MP", 0]); location.hash = `#/rules/${x.id}`; toast("Changes saved"); }
      }, 500);
    });
    // Leaving with unsaved changes asks first.
    leaveGuard = () => state() !== base;
  }

  // ---------- Router ----------
  let leaveGuard = null, last = location.hash;
  async function route() {
    if (leaveGuard?.() && location.hash !== last) {
      const target = location.hash;
      history.replaceState(null, "", last);
      if (!(await confirm({ title: "Discard unsaved changes?", message: "Your edits to this rule have not been saved.", label: "Discard" }))) return;
      leaveGuard = null; history.replaceState(null, "", target);
    }
    leaveGuard = null;
    last = location.hash;
    const parts = (location.hash.replace(/^#\/?/, "") || "rules").split("/");
    const x = parts[1] && parts[1] !== "new" ? byId(parts[1]) : null;
    if (parts[1] === "new") renderEdit(null);
    else if (parts[1] && !x) view.innerHTML = `<div class="oq-error-page"><div class="oq-empty">{{illustration:error-404}}<div class="oq-empty__title">Rule not found</div><div class="oq-small">It may have been deleted.</div><a class="oq-btn oq-sm" href="#/rules">Back to rules</a></div></div>`;
    else if (x && parts[2] === "edit") renderEdit(x);
    else if (x) renderDetail(x);
    else renderList();
    view.focus({ preventScroll: true });
    scrollTo(0, 0);
  }
  addEventListener("hashchange", route);
  syncCount();
  route();
});
</script>
</body>
</html>
