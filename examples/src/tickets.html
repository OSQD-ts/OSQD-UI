<!doctype html>
<html lang="en" class="oq" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Board</title>
<link rel="stylesheet" href="../styles/index.css">
<link rel="stylesheet" href="lib/samples.css">
<script src="../assets/osqd-ui-elements.js" defer></script>
<script src="lib/forms-logic.js" defer></script>
<script src="lib/demo-kit.js" defer></script>
<style>
  body { height: 100vh; height: 100dvh; }
  .page { display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 12px; padding: 16px; overflow: auto; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 8px; min-height: 120px; padding: 8px; border-radius: var(--oq-radius-lg); background: color-mix(in srgb, var(--oq-hover) 45%, transparent); }
  .col.is-over { outline: 2px dashed var(--oq-focus); outline-offset: -2px; }
  .col > header { display: flex; align-items: center; gap: 8px; padding: 4px 6px; }
  .ticket { cursor: grab; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ticket:hover, .ticket[data-menu-open] { border-color: var(--oq-border-strong); }
  .ticket:focus-visible { outline: 2px solid var(--oq-focus); outline-offset: 1px; }
  .ticket.is-dragging { opacity: 0.4; }
  .ticket__head { display: flex; align-items: flex-start; gap: 4px; }
  .ticket__title { flex: 1 1 auto; min-width: 0; font-weight: 500; line-height: 1.35; }
  /* The card's own menu button: always there on touch, on hover or focus with a mouse. */
  .ticket__more { margin: -6px -8px -6px 0; flex: none; }
  @media (hover: hover) { .ticket__more { opacity: 0; } .ticket:hover .ticket__more, .ticket:focus-within .ticket__more, .ticket[data-menu-open] .ticket__more { opacity: 1; } }
  .toolbar { padding: 10px 16px; border-bottom: 1px solid var(--oq-border); background: var(--oq-surface); }
  .toolbar .filter { flex: 1 1 420px; min-width: 0; max-width: 640px; }
  .list-view { padding: 16px; overflow: auto; }
  .list-view tr { cursor: pointer; }
  .proj { display: flex; gap: 2px; }
  .proj-select { display: none; width: 140px; }
  @media (max-width: 1100px) { .proj { display: none; } .proj-select { display: block; } }
  @media (max-width: 760px) {
    .toolbar { padding: 8px; gap: 8px; }
    .toolbar .filter { flex: 1 1 100%; max-width: none; }
    .toolbar > .oq-spacer { display: none; }
    .quick { order: 2; flex: 1 1 0; min-width: 0; }
    #count { order: 3; }
    #view { order: 4; }
  }
  @media (max-width: 420px) { .oq-appbar .sx-brand-text { display: none; } .oq-appbar > .oq-appbar__brand { min-width: 32px; justify-content: center; } #count { display: none; } }
  @media (max-width: 640px) {
    /* The board becomes a row of swipeable columns, each nearly a screen wide, snapping into place. */
    .board { grid-template-columns: repeat(4, 85vw); gap: 10px; padding: 10px; scroll-snap-type: x mandatory; scroll-padding-inline: 10px; overscroll-behavior-x: contain; }
    .col { scroll-snap-align: start; max-height: 100%; overflow-y: auto; }
    .list-view { padding: 8px; }
    .proj-select { width: 140px; }
  }
</style>
</head>
<body class="oq">
<div class="page">
  <header class="oq-appbar">
    {{brand:Tickets}}
    <nav class="proj sx-hide-sm" aria-label="Projects" id="projects">
      <button class="oq-btn oq-btn--soft oq-neutral oq-sm" aria-pressed="true">BotHandler</button>
      <button class="oq-btn oq-btn--ghost oq-neutral oq-sm" aria-pressed="false">HackerPot</button>
      <button class="oq-btn oq-btn--ghost oq-neutral oq-sm" aria-pressed="false">AdminPanel</button>
    </nav>
    <select class="oq-select oq-sm proj-select" id="proj-select" aria-label="Project"><option>BotHandler</option><option>HackerPot</option><option>AdminPanel</option></select>
    <div class="oq-spacer"></div>
    <button class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral sx-hide-sm" id="help" aria-label="Keyboard shortcuts" data-tip="Shortcuts ( ? )" data-tip-pos="bottom">{{icon:keyboard}}</button>
    {{appbar-end}}<button type="button" class="oq-menu__item" role="menuitem" id="help-menu">{{icon:keyboard:oq-sm}} Keyboard shortcuts</button>{{/appbar-end}}
    <button class="oq-btn" id="new" aria-label="New ticket">{{icon:plus:oq-sm}}<span class="sx-hide-sm">New ticket</span> <kbd class="oq-kbd sx-hide-sm">N</kbd></button>
  </header>

  <div class="toolbar oq-row oq-wrap">
    <div class="filter" id="filter"></div>
    <div class="oq-row oq-gap-1 quick sx-scroll-x" aria-label="Quick filters">
      <button class="oq-chip oq-neutral" data-quick="who:MP">Mine</button>
      <button class="oq-chip oq-neutral" data-quick="type:bug prio:P1">Urgent bugs</button>
      <button class="oq-chip oq-neutral" data-quick="status:review">In review</button>
    </div>
    <div class="oq-spacer"></div>
    <span class="oq-small oq-muted" id="count"></span>
    <div class="oq-segmented" role="group" aria-label="View" id="view">
      <button aria-pressed="true" data-v="board">Board</button>
      <button aria-pressed="false" data-v="list">List</button>
    </div>
  </div>

  <main class="board" id="board" aria-label="Board"></main>
  <main class="list-view" id="list" hidden>
    <div class="oq-table-wrap"><table class="oq-table oq-table--hover">
      <thead><tr><th>ID</th><th>Title</th><th>Type</th><th>Priority</th><th>Status</th><th>Assignee</th><th class="oq-num">Est.</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </main>
</div>

<oq-dialog id="drawer">
  <dialog class="oq-dialog oq-dialog--drawer" style="--w: 500px">
    <div class="oq-dialog__header"><span class="oq-mono oq-faint" id="d-id"></span><h3 class="oq-dialog__title oq-truncate" id="d-title"></h3><button class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral oq-sm oq-dialog__close" data-close aria-label="Close">{{icon:close}}</button></div>
    <div class="oq-dialog__body oq-stack oq-gap-5">
      <dl class="oq-dl">
        <dt>Status</dt><dd><select class="oq-select oq-sm" id="d-status" style="width: 160px" aria-label="Status"></select></dd>
        <dt>Priority</dt><dd id="d-prio"></dd>
        <dt>Type</dt><dd id="d-type"></dd>
        <dt>Assignee</dt><dd id="d-who"></dd>
        <dt>Estimate</dt><dd id="d-est" class="oq-mono"></dd>
      </dl>
      <div class="oq-stack oq-gap-2"><div class="oq-overline">Description</div><p class="oq-muted" id="d-desc"></p></div>
      <div class="oq-stack oq-gap-2"><div class="oq-overline">Activity</div>
        <ol class="oq-timeline" id="d-activity"></ol>
        <div class="oq-input-group"><input class="oq-input" id="d-comment" placeholder="Add a comment…" aria-label="Comment"><button class="oq-btn oq-sm" id="d-send">Send</button></div>
      </div>
    </div>
  </dialog>
</oq-dialog>

<oq-dialog id="create">
  <dialog class="oq-dialog">
    <div class="oq-dialog__header"><h3 class="oq-dialog__title">New ticket</h3><button class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral oq-sm oq-dialog__close" data-close aria-label="Close">{{icon:close}}</button></div>
    <form class="oq-dialog__body oq-stack" id="create-form">
      <div class="oq-field" id="title-field"><label class="oq-label" for="c-title">Title <span class="oq-req">*</span></label><input class="oq-input" id="c-title" name="title"><span class="oq-help" id="title-help">What is wrong or what is wanted, in one line.</span></div>
      <div class="oq-grid" style="--min: 140px">
        <label class="oq-field"><span class="oq-label">Type</span><select class="oq-select" name="type"><option value="bug">Bug</option><option value="feature">Feature</option><option value="chore">Chore</option></select></label>
        <label class="oq-field"><span class="oq-label">Priority</span><select class="oq-select" name="prio"><option>P1</option><option selected>P2</option><option>P3</option></select></label>
        <label class="oq-field"><span class="oq-label">Estimate</span><div class="oq-input-group"><input class="oq-input" name="est" value="2" inputmode="numeric" aria-label="Estimate"><span class="oq-addon">h</span></div></label>
      </div>
      <label class="oq-field"><span class="oq-label">Description</span><textarea class="oq-textarea" name="desc"></textarea></label>
    </form>
    <div class="oq-dialog__footer"><button class="oq-btn oq-btn--ghost oq-neutral" data-close="cancel">Cancel</button><button class="oq-btn" form="create-form" type="submit">Create</button></div>
  </dialog>
</oq-dialog>

<script>
addEventListener("DOMContentLoaded", () => {
  const { $, $$, esc, queryBar, matchTerms, contextMenu, shortcuts, copyText, toast } = OQX;
  const ME = "MP";
  const STATUSES = [["todo", "To do", "neutral"], ["doing", "In progress", "primary"], ["review", "Review", "secondary"], ["done", "Done", "success"]];
  const TYPE = { bug: "danger", feature: "info", chore: "neutral" };
  const PRIO = { P1: "danger", P2: "warning", P3: "neutral" };
  let seq = 220;
  const tickets = [
    ["Reload ignores changed port", "bug", "P1", "doing", "MP", 3, "A SIGHUP reload with a new port keeps listening on the old one and reports success."],
    ["CIDR allowlist matches nothing when written with spaces", "bug", "P1", "todo", "AK", 2, "\" 10.0.0.0/8\" is accepted by the parser but never matches."],
    ["Export events as CSV", "feature", "P2", "todo", "MP", 4, "Same columns as the events table, current filter applied."],
    ["Redis store: reconnect with backoff", "feature", "P2", "review", "AK", 6, "Exponential backoff capped at 30 s, memory fallback in between."],
    ["Threshold above detector cap should warn", "feature", "P3", "doing", "MP", 2, "Show a warning in the dashboard when a threshold can never be reached."],
    ["Bump tsup to 8.5", "chore", "P3", "done", "BOT", 1, "Routine dependency update."],
    ["Dashboard: dense table mode", "feature", "P3", "done", "MP", 2, "Toggle between comfortable and dense rows."],
    ["Counter resets when retention trims", "bug", "P2", "review", "AK", 3, "Totals drop to zero after the nightly trim."],
    ["Log viewer: jump to next error", "feature", "P3", "todo", "JN", 2, "One key to move between error lines while following the tail."],
  ].map(([title, type, prio, status, who, est, desc]) => ({ id: `OSQD-${++seq}`, title, type, prio, status, who, est, desc, activity: [["Created", who, "3 d", "neutral"]] }));

  const fields = [
    { name: "status", label: "Status", type: "enum", options: STATUSES.map((s) => s[0]) },
    { name: "type", label: "Type", type: "enum", options: ["bug", "feature", "chore"] },
    { name: "prio", label: "Priority", type: "enum", options: ["P1", "P2", "P3"] },
    { name: "who", label: "Assignee", type: "enum", options: ["MP", "AK", "JN", "BOT"] },
    { name: "est", label: "Estimate (h)", type: "number" },
  ];
  let view = "board";
  const bar = queryBar($("#filter"), { fields, label: "Filter tickets", placeholder: "Filter… e.g. type:bug prio:P1 est>2", onChange: () => render() });
  const visible = () => tickets.filter((t) => matchTerms(bar.terms, t, (x) => `${x.id} ${x.title} ${x.desc}`));

  const card = (t) => `
    <article class="oq-card ticket" draggable="true" data-id="${t.id}" tabindex="0" aria-label="${esc(t.id)} ${esc(t.title)}">
      <div class="ticket__head"><div class="ticket__title">${esc(t.title)}</div><button type="button" class="oq-btn oq-btn--icon oq-btn--ghost oq-neutral oq-sm ticket__more" aria-label="Actions for ${t.id}" aria-haspopup="menu">{{icon:more-horizontal}}</button></div>
      <div class="oq-row oq-gap-1">
        <span class="oq-mono oq-tiny oq-faint">${t.id}</span>
        <span class="oq-chip oq-sm oq-chip--square oq-${TYPE[t.type]}">${t.type}</span>
        <span class="oq-chip oq-sm oq-chip--square oq-${PRIO[t.prio]}">${t.prio}</span>
        <span class="oq-spacer"></span>
        <span class="oq-tiny oq-faint oq-mono">${t.est}h</span>
        <span class="oq-avatar oq-sm" title="${t.who}">${t.who}</span>
      </div>
    </article>`;
  const label = (k) => STATUSES.find((s) => s[0] === k);

  function render() {
    const list = visible();
    $("#count").textContent = `${list.length} of ${tickets.length}`;
    $("#board").hidden = view !== "board";
    $("#list").hidden = view !== "list";
    $("#board").innerHTML = STATUSES.map(([key, name, color]) => {
      const items = list.filter((t) => t.status === key);
      return `<section class="col" data-status="${key}" aria-label="${name}">
        <header><span class="oq-dot oq-${color}"></span><span class="oq-strong oq-small">${name}</span><span class="oq-badge oq-neutral">${items.length}</span></header>
        ${items.map(card).join("") || `<div class="oq-small oq-faint" style="padding: 8px">Nothing here</div>`}
      </section>`;
    }).join("");
    $("#rows").innerHTML = list.map((t) => {
      const [, name, color] = label(t.status);
      return `<tr data-id="${t.id}" tabindex="0"><td class="oq-mono oq-small">${t.id}</td><td>${esc(t.title)}</td>
        <td><span class="oq-chip oq-sm oq-${TYPE[t.type]}">${t.type}</span></td><td><span class="oq-chip oq-sm oq-chip--square oq-${PRIO[t.prio]}">${t.prio}</span></td>
        <td><span class="oq-status"><span class="oq-dot oq-${color}"></span>${name}</span></td><td><span class="oq-avatar oq-sm">${t.who}</span></td><td class="oq-num">${t.est}h</td></tr>`;
    }).join("") || `<tr><td colspan="7"><div class="oq-empty"><div class="oq-empty__title">No tickets match</div><div class="oq-small">Remove a filter or press Backspace in the filter box.</div></div></td></tr>`;
  }
  const move = (t, status) => {
    if (t.status === status) return;
    t.status = status;
    t.activity.push([`Moved to ${label(status)[1]}`, ME, "now", label(status)[2]]);
    render();
    toast(`${t.id} → ${label(status)[1]}`);
  };

  // View switch and quick filters.
  const setView = (v) => { view = v; $$("#view button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v))); render(); };
  $("#view").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) setView(b.dataset.v); };
  $$("[data-quick]").forEach((b) => (b.onclick = () => bar.set(b.dataset.quick)));
  const project = (name) => {
    $$("#projects button").forEach((x) => { const on = x.textContent === name; x.setAttribute("aria-pressed", String(on)); x.classList.toggle("oq-btn--soft", on); x.classList.toggle("oq-btn--ghost", !on); });
    $("#proj-select").value = name;
    toast(`Switched to ${name}`, "info");
  };
  $("#projects").onclick = (e) => { const b = e.target.closest("button"); if (b) project(b.textContent); };
  $("#proj-select").onchange = (e) => project(e.target.value);

  // Drag and drop between columns.
  let dragId = null;
  const board = $("#board");
  board.addEventListener("dragstart", (e) => { const c = e.target.closest(".ticket"); if (!c) return; dragId = c.dataset.id; c.classList.add("is-dragging"); });
  board.addEventListener("dragend", () => { dragId = null; render(); });
  board.addEventListener("dragover", (e) => {
    const col = e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    $$(".col").forEach((c) => c.classList.toggle("is-over", c === col));
  });
  board.addEventListener("drop", (e) => {
    const col = e.target.closest(".col"); if (!col || !dragId) return;
    e.preventDefault();
    move(tickets.find((x) => x.id === dragId), col.dataset.status);
  });

  // Detail drawer.
  const drawer = $("#drawer");
  let current = null;
  const renderActivity = () => {
    $("#d-activity").innerHTML = current.activity.map(([what, who, when, color]) => `<li class="oq-timeline__item oq-${color ?? "primary"}"><span class="oq-timeline__dot"></span><div class="oq-timeline__content"><div class="oq-timeline__head"><span class="oq-timeline__title">${esc(what)}</span><span class="oq-timeline__time">${when}</span></div><div class="oq-timeline__body">${who}</div></div></li>`).join("");
  };
  function open(id) {
    current = tickets.find((t) => t.id === id);
    if (!current) return;
    $("#d-id").textContent = current.id;
    $("#d-title").textContent = current.title;
    $("#d-status").innerHTML = STATUSES.map(([k, l]) => `<option value="${k}" ${k === current.status ? "selected" : ""}>${l}</option>`).join("");
    $("#d-prio").innerHTML = `<span class="oq-chip oq-sm oq-chip--square oq-${PRIO[current.prio]}">${current.prio}</span>`;
    $("#d-type").innerHTML = `<span class="oq-chip oq-sm oq-${TYPE[current.type]}">${current.type}</span>`;
    $("#d-who").innerHTML = `<span class="oq-row oq-gap-2"><span class="oq-avatar oq-sm">${current.who}</span>${current.who}</span>`;
    $("#d-est").textContent = `${current.est} h`;
    $("#d-desc").textContent = current.desc || "No description.";
    renderActivity();
    drawer.show();
  }
  $("#d-status").onchange = (e) => { move(current, e.target.value); renderActivity(); };
  $("#d-send").onclick = () => {
    const v = $("#d-comment").value.trim(); if (!v) return;
    current.activity.push([`“${v}”`, ME, "now", "secondary"]); $("#d-comment").value = ""; renderActivity();
  };
  $("#d-comment").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#d-send").click(); });
  document.addEventListener("click", (e) => {
    const more = e.target.closest(".ticket__more");
    if (more) { e.stopPropagation(); cm.open(more.closest(".ticket")); return; }
    const el = e.target.closest(".ticket, #rows tr[data-id]");
    if (el && !e.target.closest("dialog")) open(el.dataset.id);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches?.(".ticket, #rows tr[data-id]")) open(e.target.dataset.id); });

  // Right-click, Shift+F10, a long press or the card's "⋯" button: the same menu.
  const cm = contextMenu(document.body, ".ticket, #rows tr[data-id]", {
    title: (el) => el.dataset.id,
    items: [
      { act: "open", label: "Open", hint: "Enter" },
      { act: "mine", label: "Assign to me", disabled: (el) => tickets.find((t) => t.id === el.dataset.id)?.who === ME },
      { act: "copy", label: "Copy ID" },
      "-",
      ...STATUSES.map(([k, l]) => ({ act: `move:${k}`, label: `Move to ${l}`, disabled: (el) => tickets.find((t) => t.id === el.dataset.id)?.status === k })),
      "-",
      { act: "delete", label: "Delete…", danger: true },
    ],
    onAction: (act, el) => {
      const t = tickets.find((x) => x.id === el.dataset.id);
      if (act === "open") open(t.id);
      if (act === "mine") { t.who = ME; t.activity.push(["Assigned to MP", ME, "now", "primary"]); render(); toast(`${t.id} assigned to you`); }
      if (act === "copy") copyText(t.id).then(() => toast(`Copied ${t.id}`));
      if (act.startsWith("move:")) move(t, act.slice(5));
      if (act === "delete") { tickets.splice(tickets.indexOf(t), 1); render(); toast(`${t.id} deleted`, "danger"); }
    },
  });

  // New ticket.
  const create = $("#create");
  const showCreate = () => { $("#create-form").reset(); $("#title-field").classList.remove("is-invalid"); create.show(); setTimeout(() => $("#c-title").focus(), 30); };
  $("#new").onclick = showCreate;
  $("#create-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const title = String(f.get("title")).trim();
    if (!title) { $("#title-field").classList.add("is-invalid"); $("#c-title").setAttribute("aria-invalid", "true"); $("#title-help").textContent = "A title is required."; $("#c-title").focus(); return; }
    const t = { id: `OSQD-${++seq}`, title, type: f.get("type"), prio: f.get("prio"), status: "todo", who: ME, est: +f.get("est") || 1, desc: String(f.get("desc")), activity: [["Created", ME, "now", "neutral"]] };
    tickets.unshift(t); render(); create.close(); toast(`${t.id} created`);
  });

  // Keyboard shortcuts with a "?" overlay.
  const sc = shortcuts([
    { keys: "n", label: "New ticket", group: "Tickets", run: showCreate },
    { keys: "/", label: "Focus the filter", group: "Tickets", run: () => bar.focus() },
    { keys: "g b", label: "Board view", group: "Views", run: () => setView("board") },
    { keys: "g l", label: "List view", group: "Views", run: () => setView("list") },
    { keys: "escape", label: "Close panels and menus", group: "General" },
  ]);
  $("#help").onclick = sc.toggle;
  $("#help-menu").onclick = sc.toggle;

  render();
});
</script>
</body>
</html>
