<!doctype html>
<html lang="en" class="oq" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found</title>
<link rel="stylesheet" href="../styles/index.css">
<script>
  // Same theme as the galleries (they store it under this key); dark when nothing is stored.
  try { document.documentElement.dataset.theme = localStorage.getItem("oq-preview-theme") || "dark"; } catch {}
</script>
<style>
  html, body { margin: 0; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 14px 20px; }
</style>
</head>
<body class="oq">
  <header class="top">
    <a class="oq-appbar__brand" href="../preview-layout.html">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="4" fill="none" stroke="var(--oq-primary)" stroke-width="2"/><rect x="6" y="6" width="8" height="8" rx="1.5" fill="var(--oq-warning)"/></svg>
      OSQD
    </a>
  </header>
  <main class="oq-error-page oq-error-page--full oq-warning">
      <svg class="oq-illustration" viewBox="0 0 160 120" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="80" cy="106" rx="54" ry="6" style="fill:var(--oq-hover, #403e41);stroke:none"/><rect x="22" y="14" width="116" height="84" rx="6" style="fill:var(--oq-surface, #2d2a2e);stroke:var(--oq-border-strong, #5b595c)"/><path d="M22 28h116" style="fill:none;stroke:var(--oq-border-strong, #5b595c)"/><circle cx="31" cy="21" r="2" style="fill:var(--oq-danger, #ff6188);stroke:none"/><circle cx="38" cy="21" r="2" style="fill:var(--oq-warning, #ffd866);stroke:none"/><circle cx="45" cy="21" r="2" style="fill:var(--oq-success, #a9dc76);stroke:none"/><text x="80" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" style="fill:var(--oq-warning, #ffd866);stroke:none">404</text><path d="M58 84h44" style="fill:none;stroke:var(--oq-text-faint, #939293);stroke-width:2;stroke-dasharray:4 5"/></svg>
      <div class="oq-error-page__code">404</div>
      <h1 class="oq-error-page__title">Page not found</h1>
      <p class="oq-error-page__message">The address may be mistyped, or the page has moved. Check the link, or go back to the start.</p>
      <div class="oq-error-page__actions">
        <a class="oq-btn" href="../preview-layout.html">Go to start</a>
        <button class="oq-btn oq-btn--outline oq-neutral" type="button" onclick="history.back()">Go back</button>
      </div>
      <div class="oq-error-page__foot">Path: <code id="path"></code></div>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
