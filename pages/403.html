<!doctype html>
<html lang="en" class="oq" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No Access</title>
<link rel="stylesheet" href="../styles/index.css">
<script>
  // Same theme as the galleries (they store it under this key); dark when nothing is stored.
  try { document.documentElement.dataset.theme = localStorage.getItem("oq-preview-theme") || "dark"; } catch {}
</script>
<style>
  html, body { margin: 0; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 14px 20px; }
</style>
</head>
<body class="oq">
  <header class="top">
    <a class="oq-appbar__brand" href="../preview-layout.html">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="4" fill="none" stroke="var(--oq-primary)" stroke-width="2"/><rect x="6" y="6" width="8" height="8" rx="1.5" fill="var(--oq-warning)"/></svg>
      OSQD
    </a>
  </header>
  <main class="oq-error-page oq-error-page--full oq-secondary">
      <svg class="oq-illustration" viewBox="0 0 160 120" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="80" cy="106" rx="54" ry="6" style="fill:var(--oq-hover, #403e41);stroke:none"/><path d="M80 12l38 14v30c0 24-16 40-38 48-22-8-38-24-38-48V26z" style="fill:var(--oq-surface, #2d2a2e);stroke:var(--oq-border-strong, #5b595c)"/><path d="M70 56v-8a10 10 0 0 1 20 0v8" style="fill:none;stroke:var(--oq-primary, #78dce8);stroke-width:4"/><rect x="62" y="56" width="36" height="28" rx="4" style="fill:var(--oq-primary, #78dce8);stroke:var(--oq-primary, #78dce8)"/><circle cx="80" cy="67" r="3.5" style="fill:var(--oq-surface, #2d2a2e);stroke:none"/><path d="M80 70v6" style="fill:none;stroke:var(--oq-surface, #2d2a2e);stroke-width:3"/></svg>
      <div class="oq-error-page__code">403</div>
      <h1 class="oq-error-page__title">No access</h1>
      <p class="oq-error-page__message">Your account is signed in but is not allowed to see this page. Ask an administrator for access.</p>
      <div class="oq-error-page__actions">
        <button class="oq-btn" type="button" id="req">Request access</button>
        <a class="oq-btn oq-btn--outline oq-neutral" href="../preview-layout.html">Go to start</a>
      </div>
      <div class="oq-error-page__foot">Signed in as <strong>michal@osqd.dev</strong> · <a href="#">Switch account</a></div>
  </main>
  <script>
    document.getElementById("req").onclick = (e) => {
      e.target.textContent = "Request sent";
      e.target.disabled = true;
    };
  </script>
</body>
</html>
